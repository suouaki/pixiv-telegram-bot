services:
  pixiv-telegram-bot:
    build: .
    container_name: pixiv_telegram_bot
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-YOUR_TELEGRAM_BOT_TOKEN}
      - BOT_PASSWORD=${BOT_PASSWORD:-}
      - PIXIV_COOKIE=${PIXIV_COOKIE:-}
      - GROUP_CHAT_ID=${GROUP_CHAT_ID:-}
      - DATA_DIR=/app/data
      - UGOIRA_OUTPUT_FORMAT=mp4
      - SEND_MODE=document_and_photo
      - NODE_ENV=production
    volumes:
      - pixiv_data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pixiv_data:
